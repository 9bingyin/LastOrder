[package]
name = "lastorder"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "lastorder"
path = "src/main.rs"

[lints.rust]
unsafe_code = "deny"
unused_qualifications = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
blake3 = "1.8.7"
bytes = "1.11"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4.3"
iroh = "1.3.0"
iroh-tickets = "1.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webrtc = "0.14.0"
uuid = { version = "1.26", features = ["v4"] }
url = "2.5.8"
webbrowser = "1.0"
