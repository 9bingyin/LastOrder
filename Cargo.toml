[package]
name = "lastorder"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "lastorder"
path = "src/main.rs"

[lints.rust]
unsafe_code = "deny"
unused_qualifications = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
iroh = "1.3.0"
iroh-gossip = "0.101.0"
iroh-ping = "1.0.0"
ratatui = "0.30.2"
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
